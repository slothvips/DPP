services:
  jenkins:
    build: .
    image: dpp-jenkins:local
    container_name: dpp-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/usr/share/jenkins/ref/casc.yaml:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    restart: unless-stopped

  jenkins-b:
    image: dpp-jenkins:local
    container_name: dpp-jenkins-b
    ports:
      - "8081:8080"
      - "50001:50000"
    volumes:
      - jenkins_home_b:/var/jenkins_home
      - ./casc.yaml:/usr/share/jenkins/ref/casc.yaml:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    # 镜像入口是 tini + jenkins.sh。这里改写根地址后再交给原来的入口，避免和实例 A 抢同一份配置。
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sed -e 's|http://localhost:8080/|http://localhost:8081/|' \
            -e 's|DPP local test Jenkins"|DPP local test Jenkins B"|' \
            /usr/share/jenkins/ref/casc.yaml > /tmp/casc.yaml
        export CASC_JENKINS_CONFIG=/tmp/casc.yaml
        exec /usr/bin/tini -- /usr/local/bin/jenkins.sh
    restart: unless-stopped

volumes:
  jenkins_home:
  jenkins_home_b:
