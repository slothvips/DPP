name = "dpp-sync-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "dpp-sync"
database_id = "<YOUR_PRODUCTION_D1_ID>"
migrations_dir = "migrations"

[durable_objects]
bindings = [
  { name = "SYNC_PUSH_COORDINATOR", class_name = "SyncPushCoordinator" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncPushCoordinator"]

# 自定义域名按 packages/DEPLOY.md 在部署时填写，未配置时使用 workers.dev
# [[routes]]
# pattern = "sync.example.com"
# zone_name = "example.com"
# custom_domain = true

[env.test]
name = "dpp-sync-test"
workers_dev = true

[[env.test.d1_databases]]
binding = "DB"
database_name = "dpp-sync-test"
database_id = "<YOUR_TEST_D1_ID>"
migrations_dir = "migrations"

[env.test.durable_objects]
bindings = [
  { name = "SYNC_PUSH_COORDINATOR", class_name = "SyncPushCoordinator" },
]

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["SyncPushCoordinator"]

